# 本地分析端配置
paths:
  received_keyframes_dir: "local_analysis_client/received_keyframes"
  processed_results_dir: "local_analysis_client/processed_results"

models:
  use_merged_model: true
  merged_model_path: "local_analysis_client/yolov8n.pt"
  hand_class_names:
    - "person"
  standing_class_names:
    - "standing"

inference:
  imgsz: 640
  conf: 0.35
  iou: 0.45
  max_det: 100

server:
  host: "0.0.0.0"
  port: 8000

cloud:
  push_enabled: true
  push_url: "http://8.148.13.80:8011/api/interaction-results/with-video"
  push_timeout: 30
